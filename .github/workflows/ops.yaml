name: ops

# Maintenance tasks on the server, run from the Actions tab without SSH.
# Output never includes patient details (this repository's logs may be public).
on:
  workflow_dispatch:
    inputs:
      task:
        description: Task to run on the server
        type: choice
        required: true
        options:
          - list-backups
          - backup-now
          - restore-appointments-dry-run
          - restore-appointments
      backup_file:
        description: "For restore tasks: a file name from list-backups, e.g. pre-deploy-2026-11-04-182958.sqlite3"
        required: false
        default: ''
      ids:
        description: "For restore tasks, optional: comma-separated appointment ids (default: every missing one)"
        required: false
        default: ''

jobs:
  ops:
    runs-on: ubuntu-latest
    env:
      TASK: ${{ inputs.task }}
      BACKUP_FILE: ${{ inputs.backup_file }}
      IDS: ${{ inputs.ids }}
    steps:
      - name: Run task on Vultr via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USERNAME }}
          key: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          envs: TASK,BACKUP_FILE,IDS
          script: |
            set -eu
            BACKUPS=/root/clinic-backups
            # Validates the restore inputs and sets RESTORE_ARGS (runs in the main shell so exit works)
            validate_restore() {
              case "$BACKUP_FILE" in
                ''|*/*|*..*|*' '*) echo "backup_file must be a plain file name from list-backups"; exit 1 ;;
              esac
              [ -f "$BACKUPS/$BACKUP_FILE" ] || { echo "No such backup: $BACKUP_FILE"; exit 1; }
              case "$IDS" in
                *[!0-9,]*) echo "ids must be numbers separated by commas"; exit 1 ;;
              esac
              RESTORE_ARGS="/backups/$BACKUP_FILE"
              [ -z "$IDS" ] || RESTORE_ARGS="$RESTORE_ARGS --ids $IDS"
            }
            case "$TASK" in
              list-backups)
                ls -la "$BACKUPS" ;;
              backup-now)
                docker exec clinic python manage.py backup_db --dest /backups --keep 14 ;;
              restore-appointments-dry-run)
                validate_restore
                docker exec clinic python manage.py restore_appointments $RESTORE_ARGS --dry-run ;;
              restore-appointments)
                validate_restore
                docker exec clinic python manage.py restore_appointments $RESTORE_ARGS ;;
              *)
                echo "Unknown task: $TASK"; exit 1 ;;
            esac
